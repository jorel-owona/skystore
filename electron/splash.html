<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SKYSTORE Loading</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: transparent;
      overflow: hidden;
    }
    .splash-container {
      background-color: #0f172a; /* matches app background */
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #334155;
    }
    img {
      max-width: 250px;
      border-radius: 12px;
    }
    .loading-text {
      margin-top: 20px;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 1px;
    }
    /* Simple spinner */
    .spinner {
      margin-top: 15px;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="../asset/logoSkyStore.jpeg" alt="Logo SKYSTORE" />
    <div class="loading-text">DÉMARRAGE EN COURS...</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
